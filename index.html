/* =========================================================
   TOKENS — cambiar --accent* recolorea toda la interfaz
   ========================================================= */
:root{
  --accent:#006f32;          /* verde Incomelec (logo) */
  --accent-strong:#00491f;
  --accent-soft:#7cc49b;
  --accent-tint:#e4f3ea;
  --on-accent:#ffffff;

  --bg:#f2f2f3;
  --shell:#f7f7f8;
  --card:#ffffff;
  --sub:#f4f5f5;
  --line:#e8eae9;
  --ink:#111413;
  --ink-2:#4b524e;           /* 7.9:1 sobre blanco */
  --ink-3:#5e6561;           /* 6.0:1 sobre blanco */
  --series-neutral:#7a837e;  /* 3.9:1 marcas no textuales */
  --grid:#eceeed;

  --bad:#b42318; --bad-tint:#fdecea;
  --warn:#8a5300; --warn-tint:#fdf2dc;
  --good:#006f32; --good-tint:#e4f3ea;

  --shadow:0 1px 2px rgb(0 0 0 / .04), 0 8px 24px rgb(0 0 0 / .04);
  --shadow-hover:0 2px 4px rgb(0 0 0 / .05), 0 16px 36px rgb(0 0 0 / .08);
  --r-xl:28px; --r-lg:22px; --r-md:14px; --r-sm:10px;
  --ease:cubic-bezier(.2,.8,.2,1);
  --font:"Plus Jakarta Sans", "Segoe UI", system-ui, -apple-system, Arial, sans-serif;
  color-scheme:light;
}
:root[data-theme="dark"]{
  --accent:#4cc27f; --accent-strong:#0f3d24; --accent-soft:#2c7a4e; --accent-tint:#163323; --on-accent:#06140c;
  --bg:#0c0f0e; --shell:#111514; --card:#171c1a; --sub:#1e2421; --line:#28302c;
  --ink:#eef2f0; --ink-2:#c3cbc6; --ink-3:#a7b0ab; --series-neutral:#8f9893; --grid:#232a27;
  --bad:#ff8a7a; --bad-tint:#3a1714; --warn:#f2bd5c; --warn-tint:#342610; --good:#4cc27f; --good-tint:#163323;
  --shadow:0 1px 2px rgb(0 0 0 / .4), 0 8px 24px rgb(0 0 0 / .25);
  --shadow-hover:0 2px 4px rgb(0 0 0 / .4), 0 16px 36px rgb(0 0 0 / .4);
  color-scheme:dark;
}
*{box-sizing:border-box}
html,body{margin:0}
body{background:var(--bg);color:var(--ink);font-family:var(--font);-webkit-font-smoothing:antialiased;font-size:14px;line-height:1.45;transition:background .25s var(--ease),color .25s var(--ease)}
button{font-family:inherit;color:inherit}
:focus-visible{outline:2.5px solid var(--accent);outline-offset:2px;border-radius:8px}
.num,.tnum{font-variant-numeric:tabular-nums}
.sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.ic{width:18px;height:18px;flex-shrink:0;stroke:currentColor;fill:none;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round}

/* ---------- Shell ---------- */
.app{display:grid;grid-template-columns:252px minmax(0,1fr);grid-template-areas:"head head" "side main";align-items:start;min-height:100vh;gap:16px;padding:16px}
/* ---------- Encabezado verde ---------- */
.hdr{grid-area:head;position:relative;display:flex;align-items:center;justify-content:space-between;gap:20px;min-height:92px;padding:14px 64px 14px 34px;border-radius:26px;color:#fff;isolation:isolate;z-index:50}
.hdr::before{content:"";position:absolute;inset:0;z-index:-1;border-radius:inherit;
  background:
    radial-gradient(circle,rgb(255 255 255 / .06) 1px,transparent 1.6px) 0 0/30px 30px,
    radial-gradient(60% 120% at 88% -10%,rgb(120 190 150 / .55),transparent 60%),
    radial-gradient(45% 90% at 100% 110%,rgb(8 60 36 / .65),transparent 70%),
    linear-gradient(100deg,#1a824d 0%,#177a47 25%,#126a3f 55%,#14683f 80%,#0f5133 100%);
  clip-path:polygon(0 0,calc(100% - 54px) 0,100% 54px,100% 100%,0 100%)}
.hdr-l{display:flex;align-items:center;min-width:0}
.logo{display:inline-flex;border:2.5px solid #fff;border-radius:17px;padding:2.5px;flex-shrink:0;box-shadow:0 6px 16px rgb(0 40 20 / .18)}
.logo span{display:block;background:#fff;border-radius:13px;padding:7px 26px 8px;color:#136b3c;font:italic 800 27px/1 "Poppins","Plus Jakarta Sans",Arial,sans-serif;letter-spacing:.005em;white-space:nowrap}
.hdr-r{display:flex;align-items:center;gap:12px;flex-shrink:0}
.ctrl{height:48px;background:#fff;color:#111413;border-radius:999px;display:flex;align-items:center;box-shadow:0 2px 10px rgb(0 0 0 / .10)}
.seg{gap:4px;padding:4px 6px}
.seg button{width:40px;height:40px;border-radius:50%;border:0;background:none;display:grid;place-items:center;cursor:pointer;color:#3d4440}
.seg button .ic{width:19px;height:19px}
.seg button[aria-checked="true"]{background:#111413;color:#fff}
.notif{position:absolute;top:calc(100% + 10px);right:0;width:360px;background:var(--card);color:var(--ink);border-radius:var(--r-lg);box-shadow:var(--shadow-hover);padding:12px;z-index:65;display:none}
.notif.show{display:block}
.notif h3{margin:2px 4px 10px;font-size:13px}
.notif .list{gap:6px}
.side{grid-area:side;position:sticky;top:16px;max-height:calc(100vh - 32px);background:var(--card);border-radius:var(--r-xl);box-shadow:var(--shadow);padding:22px 14px;display:flex;flex-direction:column;gap:18px;overflow:auto}
.brand{display:flex;align-items:center;gap:10px;padding:0 8px}
.brand img{height:30px;display:block}
:root[data-theme="dark"] .brand img{filter:brightness(1.6) saturate(.9);background:#fff;border-radius:8px;padding:2px 6px}
.brand small{display:block;font-size:11px;color:var(--ink-3);font-weight:600;letter-spacing:.02em}
.nav-group{font-size:11px;font-weight:700;letter-spacing:.12em;color:var(--ink-3);padding:0 12px;margin-top:4px}
.nav{position:relative;display:flex;flex-direction:column;gap:2px}
.nav-ind{position:absolute;left:0;right:0;height:42px;border-radius:12px;background:var(--accent);transition:transform .32s var(--ease),height .32s var(--ease);z-index:0}
.nav-btn{position:relative;z-index:1;display:flex;align-items:center;gap:11px;border:0;background:none;padding:11px 12px;border-radius:12px;font-weight:600;font-size:13.5px;cursor:pointer;color:var(--ink-2);text-align:left;min-height:42px;transition:color .2s}
.nav-btn:hover{color:var(--ink)}
.nav-btn[aria-current="page"]{color:var(--on-accent)}
.nav.gen .nav-btn[aria-current="page"]{background:var(--accent)}
.nav-btn .count{margin-left:auto;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--sub);color:var(--ink-2)}
.nav-btn[aria-current="page"] .count{background:rgb(255 255 255 / .22);color:var(--on-accent)}
.side-card{margin-top:auto;flex-shrink:0;border-radius:20px;padding:16px;color:#fff;display:flex;flex-direction:column;gap:12px;
  background:radial-gradient(90% 70% at 100% 0%,rgb(255 255 255 / .10),transparent 60%),linear-gradient(160deg,#168245,#0b5a2c 75%);box-shadow:0 10px 24px rgb(0 73 31 / .25)}
.sc-h{display:flex;gap:10px;align-items:flex-start}
.sc-ic{width:36px;height:36px;border-radius:11px;background:rgb(255 255 255 / .16);display:grid;place-items:center;flex-shrink:0}
.sc-h b{display:block;font-size:14.5px;line-height:1.25}
.sc-h small{display:block;font-size:12px;color:rgb(255 255 255 / .85);line-height:1.35;margin-top:2px}
.sc-pill{align-self:flex-start;background:#fde9d4;color:#8a4b0e;font-size:11.5px;font-weight:800;border-radius:999px;padding:4px 10px}
.sc-box{background:rgb(255 255 255 / .12);border-radius:14px;padding:11px 12px}
.sc-box span{display:block;font-size:11.5px;font-weight:700;color:rgb(255 255 255 / .85)}
.sc-box strong{display:block;font-size:22px;font-weight:800;letter-spacing:-.015em;line-height:1.15;margin:3px 0 4px;white-space:nowrap}
.sc-box em{display:block;font-style:normal;font-size:11.5px;color:rgb(255 255 255 / .85);line-height:1.35}

.main{grid-area:main;min-width:0;display:flex;flex-direction:column;gap:16px}
.top{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.island{background:var(--card);border-radius:999px;box-shadow:var(--shadow);display:flex;align-items:center;gap:8px;padding:6px}
.search{position:relative;width:420px}
.search input{width:100%;height:48px;border:0;background:#fff;border-radius:999px;box-shadow:0 2px 8px rgb(0 0 0 / .10);padding:0 52px 0 46px;font:inherit;font-size:14.5px;color:#111413}
.search input::placeholder{color:#5e6561}
.search > .ic{position:absolute;left:17px;top:50%;transform:translateY(-50%);color:#5e6561}
.kbd{position:absolute;right:10px;top:50%;transform:translateY(-50%);font-size:11px;font-weight:700;background:#eceeed;border-radius:7px;width:26px;height:26px;right:12px;display:grid;place-items:center;color:#4b524e}
.results{position:absolute;top:calc(100% + 10px);color:var(--ink);left:0;right:0;background:var(--card);border-radius:var(--r-md);box-shadow:var(--shadow-hover);padding:6px;z-index:60;max-height:360px;overflow:auto;display:none}
.results.show{display:block}
.res{display:flex;gap:10px;align-items:center;padding:9px 10px;border-radius:10px;cursor:pointer}
.res[aria-selected="true"],.res:hover{background:var(--sub)}
.res .t{font-size:11px;font-weight:700;color:var(--ink-3);text-transform:uppercase;letter-spacing:.06em;min-width:74px}
.fresh{display:flex;align-items:center;gap:8px;padding:8px 14px;font-size:12.5px;font-weight:600;color:var(--ink-2)}
.dot{width:8px;height:8px;border-radius:50%;background:var(--accent);box-shadow:0 0 0 4px var(--accent-tint)}
.icon-btn{width:38px;height:38px;border-radius:50%;border:0;background:var(--sub);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.icon-btn:hover{color:var(--ink)}
.avatar{width:38px;height:38px;border-radius:50%;display:grid;place-items:center;font-weight:800;font-size:12px;background:#dfe9f6;color:#1d3a63}
.who{font-size:12px;line-height:1.2;padding-right:10px}.who b{display:block;font-size:13px}.who span{color:var(--ink-3)}

/* ---------- Filtro de periodo ---------- */
.topline{position:sticky;top:0;z-index:45;display:flex;align-items:center;gap:22px;padding:8px 0 10px;background:var(--bg)}
.ptitle-w{display:flex;flex-direction:column;margin:0 4px;flex-shrink:0}
.pview{font-size:12.5px;font-weight:700;color:var(--ink-3);letter-spacing:.02em;margin-top:2px}
.ptitle{margin:0;font-size:38px;font-weight:700;letter-spacing:-.025em;line-height:1.1;white-space:nowrap}
.mfilter{flex:1;display:flex;align-items:center;gap:12px;background:var(--card);border-radius:999px;box-shadow:var(--shadow-hover);padding:6px 8px 6px 18px;min-width:0}
.mf-l{display:flex;gap:8px;align-items:center;font-weight:800;font-size:13px;color:var(--ink);white-space:nowrap}
.mf-l .ic{color:var(--accent)}
.mf-chips{display:flex;gap:4px;overflow-x:auto;scrollbar-width:none;flex:1;min-width:0}
.mf-chips::-webkit-scrollbar{display:none}
.mf{border:0;background:none;border-radius:999px;padding:8px 14px;font-weight:700;font-size:13px;color:var(--ink-2);cursor:pointer;white-space:nowrap;min-height:38px;transition:background .2s,color .2s}
.mf:hover{background:var(--sub);color:var(--ink)}
.mf[aria-checked="true"]{background:var(--accent);color:var(--on-accent)}
.mf-note{font-size:12px;color:var(--ink-3);font-weight:600;white-space:nowrap;padding:0 10px}
.flatnote{padding:14px 18px}
.pnote{display:flex;gap:10px;align-items:center;font-size:13px;color:var(--ink-2)}
.pnote .ic{color:var(--warn)}
@media (max-width:1320px){.mf-note{display:none}}
@media (max-width:1100px){.topline{flex-wrap:wrap;row-gap:8px}.mfilter{flex-basis:100%}}
@media (max-width:900px){.mf-note{display:none}.mfilter{padding-left:12px}.mf-l{font-size:0;gap:0}.ptitle{font-size:28px}}
/* ---------- Vistas ---------- */
.view{display:none}
.view.active{display:block}
.vhead{display:flex;align-items:flex-end;justify-content:space-between;gap:16px;flex-wrap:wrap;margin:10px 4px 18px}
.vhead h1{font-size:40px;line-height:1.05;margin:0;font-weight:700;letter-spacing:-.025em}
.vhead p{margin:8px 0 0;color:var(--ink-2);font-size:15px}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:16px}
.c3{grid-column:span 3}.c4{grid-column:span 4}.c5{grid-column:span 5}.c6{grid-column:span 6}.c7{grid-column:span 7}.c8{grid-column:span 8}.c12{grid-column:span 12}
@media (max-width:1180px){.c3{grid-column:span 6}.c4,.c5,.c7,.c8{grid-column:span 12}.c6{grid-column:span 12}}
@media (max-width:640px){.c3{grid-column:span 12}}

.card{position:relative;background:var(--card);border-radius:var(--r-lg);box-shadow:var(--shadow);padding:22px 24px;transition:transform .25s var(--ease),box-shadow .25s var(--ease);min-width:0}
.card.hov:hover{transform:translateY(-3px);box-shadow:var(--shadow-hover)}
.card.enter{animation:rise .38s var(--ease) both;animation-delay:calc(var(--i,0) * 45ms)}
@keyframes rise{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
.ctitle{display:flex;align-items:flex-start;gap:10px;margin-bottom:14px}
.ctitle h2{font-size:16px;line-height:1.3;margin:0;font-weight:700;letter-spacing:-.005em}
.ctitle p{margin:3px 0 0;font-size:12.5px;color:var(--ink-3)}
.ctitle .open{margin-left:auto}
.open{width:32px;height:32px;border-radius:50%;border:0;background:var(--sub);display:grid;place-items:center;cursor:pointer;flex-shrink:0;color:var(--ink-2);transition:background .2s,color .2s}
.open:hover{background:var(--accent);color:var(--on-accent)}
.chart{position:relative;width:100%}
.legend{display:flex;flex-wrap:wrap;gap:6px 16px;font-size:12px;color:var(--ink-2);font-weight:600;margin:-4px 0 10px}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}
.sw-tint{background:var(--accent-tint);outline:1px solid var(--accent-soft)}
.sw-stripe{background:repeating-linear-gradient(45deg,var(--series-neutral) 0 2px,transparent 2px 5px);outline:1px solid var(--series-neutral)}

/* KPI */
.kpi{cursor:pointer;display:flex;flex-direction:column;gap:8px;container-type:inline-size;min-height:172px}
.kpi .lbl{font-size:clamp(12.5px,3.6cqi,15px);padding-right:36px;font-weight:600;color:var(--ink-2);display:flex;align-items:center;gap:8px}
.kpi .lbl .ib{width:30px;height:30px;border-radius:9px;background:var(--sub);display:grid;place-items:center;color:var(--ink-2)}
.kpi .val{font-size:clamp(32px,13cqi,58px);font-weight:800;letter-spacing:-.02em;line-height:1.05;font-variant-numeric:tabular-nums}
.kpi .val small{font-size:.42em;font-weight:600;color:var(--ink-3);margin-left:4px}
.kpi .foot{font-size:clamp(12.5px,3.4cqi,14.5px);margin-top:auto;color:var(--ink-3);display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.kpi .open{position:absolute;top:16px;right:16px}
.kpi.hero{color:#fff;background:radial-gradient(90% 80% at 100% 0%,rgb(255 255 255 / .10),transparent 60%),linear-gradient(160deg,#168245,#0b5a2c 75%);box-shadow:0 10px 24px rgb(0 73 31 / .22)}
.kpi.hero .lbl,.kpi.hero .foot,.kpi.hero .val small{color:rgb(255 255 255 / .92)}
.kpi.hero .lbl .ib{background:rgb(255 255 255 / .16);color:#fff}
.kpi.hero .open{background:#fff;color:#0b5a2c}
.kpi.hero .spark{height:40px;margin-top:2px}

.pill{display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:700;padding:3px 9px;border-radius:999px;white-space:nowrap}
.p-bad{background:var(--bad-tint);color:var(--bad)}
.p-warn{background:var(--warn-tint);color:var(--warn)}
.p-good{background:var(--good-tint);color:var(--good)}
.p-neu{background:var(--sub);color:var(--ink-2)}
.kpi.hero .pill{background:rgb(255 255 255 / .18);color:#fff}

/* Chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:0;background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:9px 15px;font-weight:700;font-size:12.5px;cursor:pointer;color:var(--ink-2);display:inline-flex;gap:8px;align-items:center;min-height:36px}
.chip .n{font-size:11px;padding:1px 7px;border-radius:999px;background:var(--sub)}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.chip[aria-pressed="true"] .n{background:rgb(255 255 255 / .2)}
:root[data-theme="dark"] .chip[aria-pressed="true"] .n{background:rgb(0 0 0 / .2)}
.chip.sm{padding:6px 12px;min-height:30px;box-shadow:none;background:var(--sub)}
.chip.sm[aria-pressed="true"]{background:var(--ink);color:var(--card)}
.ctx{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.ctx-sum{font-size:12.5px;color:var(--ink-2);font-weight:600;background:var(--card);box-shadow:var(--shadow);border-radius:999px;padding:9px 14px}

/* Tablas */
.tbl-tools{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;margin-bottom:10px}
.tbl-search{border:0;background:var(--sub);border-radius:999px;padding:9px 14px;font:inherit;font-size:13px;color:var(--ink);min-width:200px}
.tbl-wrap{overflow:auto;border-radius:var(--r-md)}
table{width:100%;border-collapse:separate;border-spacing:0;font-size:13px}
th{position:sticky;top:0;background:var(--sub);text-align:left;font-size:11.5px;font-weight:700;color:var(--ink-2);padding:0;white-space:nowrap;z-index:1}
th button{all:unset;cursor:pointer;display:flex;gap:4px;align-items:center;padding:10px 12px;width:100%;box-sizing:border-box}
th button:focus-visible{outline:2px solid var(--accent);outline-offset:-2px}
th.n button{justify-content:flex-end}
th:first-child{border-radius:10px 0 0 10px}th:last-child{border-radius:0 10px 10px 0}
td{padding:10px 12px;border-bottom:1px solid var(--line);vertical-align:middle}
td.n,th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
tbody tr{cursor:pointer;transition:background .15s}
tbody tr:hover td{background:var(--sub)}
tbody tr.is-selected td{background:var(--accent-tint)}
tbody tr.is-selected td:first-child{box-shadow:inset 3px 0 0 var(--accent)}
tfoot td{font-weight:800;border-bottom:0;border-top:2px solid var(--line)}
.cellbar{display:flex;align-items:center;gap:8px;justify-content:flex-end}
.cellbar .b{width:70px;height:6px;border-radius:4px;background:var(--grid);overflow:hidden}
.cellbar .b i{display:block;height:100%;background:var(--accent);border-radius:4px}
.muted{color:var(--ink-3)}
.sel-ring.is-selected{box-shadow:inset 0 0 0 2px var(--accent),var(--shadow-hover)}

/* Barras de progreso / bullet */
.prog{height:10px;border-radius:999px;background:var(--accent-tint);overflow:hidden}
.prog i{display:block;height:100%;border-radius:999px;background:var(--accent);width:0;transition:width .6s var(--ease)}
.brow{display:grid;grid-template-columns:minmax(150px,1.5fr) 2fr auto;gap:12px;align-items:center;padding:10px 6px;border-radius:12px;cursor:pointer}
.brow:hover{background:var(--sub)}
.brow .nm{font-weight:600;font-size:13px}
.brow .nm small{display:block;color:var(--ink-3);font-weight:500;font-size:12px}
.brow .v{font-weight:800;font-variant-numeric:tabular-nums;min-width:62px;text-align:right}

/* Anillos */
.ring-wrap{display:flex;gap:18px;align-items:center;cursor:pointer}
.ring{position:relative;width:132px;height:132px;flex-shrink:0}
.ring svg{width:100%;height:100%;transform:rotate(-90deg)}
.ring .rv{position:absolute;inset:0;display:grid;place-items:center;text-align:center}
.ring .rv b{font-size:24px;font-weight:800;letter-spacing:-.02em;display:block;font-variant-numeric:tabular-nums}
.ring .rv span{font-size:11px;color:var(--ink-3);font-weight:600}
.ring circle.arc{transition:stroke-dashoffset .7s var(--ease)}
.rleg{font-size:12.5px;display:flex;flex-direction:column;gap:6px;color:var(--ink-2)}
.rleg i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:6px;vertical-align:-1px}

/* Insights / alertas */
.list{display:flex;flex-direction:column;gap:8px}
.ins{display:flex;gap:12px;align-items:flex-start;padding:12px;border-radius:14px;background:var(--sub);cursor:pointer;border:0;text-align:left;width:100%;font:inherit;transition:background .2s}
.ins:hover{background:var(--accent-tint)}
.ins .no{width:26px;height:26px;border-radius:8px;background:var(--card);display:grid;place-items:center;font-weight:800;font-size:12px;flex-shrink:0;color:var(--accent)}
.ins b{display:block;font-size:13.5px;margin-bottom:2px}
.ins span{font-size:12.5px;color:var(--ink-2)}
.ins .meta{display:flex;gap:6px;margin-top:6px;flex-wrap:wrap}
.alert{display:flex;gap:12px;align-items:flex-start;padding:12px 14px;border-radius:14px;cursor:pointer;border:0;width:100%;text-align:left;font:inherit;background:var(--bad-tint);color:var(--ink)}
.alert.w{background:var(--warn-tint)}
.alert .ic{color:var(--bad);margin-top:2px}.alert.w .ic{color:var(--warn)}
.alert b{display:block;font-size:13.5px}
.alert span{font-size:12.5px;color:var(--ink-2)}
.alert.big{padding:18px}
.alert.big b{font-size:16px}

/* Personas / clientes */
.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));grid-auto-rows:1fr;gap:14px}
.ent{cursor:pointer;display:flex;flex-direction:column;gap:12px;padding:18px}
.ent .hd{display:flex;gap:12px;align-items:center;padding-right:30px}
.mono{width:44px;height:44px;border-radius:13px;display:grid;place-items:center;font-weight:800;font-size:14px;flex-shrink:0;background:var(--accent-tint);color:var(--accent)}
.ent h3{margin:0;font-size:14px;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;min-height:2.5em}
.ent .sub{font-size:12px;color:var(--ink-3);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.ent .hd > div{min-width:0}
.ent .prog{margin-top:auto}
.mets{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;background:var(--sub);border-radius:12px;padding:10px}
.mets div{font-size:11px;color:var(--ink-3);font-weight:600}
.mets b{display:block;font-size:17px;color:var(--ink);font-variant-numeric:tabular-nums}
.ent .open{position:absolute;top:14px;right:14px}

/* Inspector */
.scrim{position:fixed;inset:0;background:rgb(10 14 12 / .28);opacity:0;pointer-events:none;transition:opacity .25s;z-index:80}
.scrim.on{opacity:1;pointer-events:auto}
.insp{position:fixed;top:12px;right:12px;bottom:12px;width:min(520px,calc(100vw - 24px));background:var(--card);border-radius:var(--r-xl);box-shadow:0 30px 80px rgb(0 0 0 / .22);z-index:90;transform:translateX(calc(100% + 24px));transition:transform .32s var(--ease),width .32s var(--ease);display:flex;flex-direction:column}
.insp.on{transform:none}
.insp.wide{width:min(980px,calc(100vw - 24px))}
.insp header{padding:22px 24px 14px;border-bottom:1px solid var(--line)}
.insp .kind{font-size:11px;font-weight:800;letter-spacing:.12em;color:var(--ink-3);text-transform:uppercase}
.insp h2{margin:4px 0 2px;font-size:24px;letter-spacing:-.015em;line-height:1.15;padding-right:120px}
.insp .isub{color:var(--ink-2);font-size:13px}
.insp .acts{position:absolute;top:18px;right:18px;display:flex;gap:6px}
.insp .acts button[aria-pressed="true"]{background:var(--accent);color:var(--on-accent)}
.insp .body{padding:18px 24px 28px;overflow:auto;display:flex;flex-direction:column;gap:18px}
.minis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.mini{background:var(--sub);border-radius:14px;padding:12px 14px}
.mini span{font-size:11.5px;color:var(--ink-3);font-weight:600;display:block}
.mini b{font-size:20px;font-weight:800;font-variant-numeric:tabular-nums;letter-spacing:-.01em}
.mini .prog{margin-top:8px;height:6px}
.isec h3{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-3);margin:0 0 8px}
.note{font-size:12.5px;color:var(--ink-2);background:var(--sub);border-radius:12px;padding:10px 12px}
.note.w{background:var(--warn-tint);color:var(--ink)}
.kv{display:flex;justify-content:space-between;gap:12px;padding:8px 0;border-bottom:1px dashed var(--line);font-size:13px}
.kv span{color:var(--ink-2)}.kv b{font-variant-numeric:tabular-nums;text-align:right}

/* Toast */
.toasts{position:fixed;left:20px;bottom:20px;display:flex;flex-direction:column;gap:8px;z-index:120}
.toast{background:var(--card);color:var(--ink);border:1px solid var(--line);border-radius:999px;padding:11px 18px 11px 14px;display:flex;align-items:center;gap:10px;font-size:13px;font-weight:600;box-shadow:0 12px 30px rgb(0 0 0 / .25);animation:rise .25s var(--ease)}
.toast i{width:8px;height:8px;border-radius:50%;background:var(--accent)}

/* Skeleton */
.skel{background:linear-gradient(90deg,var(--sub),var(--line),var(--sub));background-size:200% 100%;animation:sh 1s linear infinite;border-radius:var(--r-lg);min-height:130px}
@keyframes sh{to{background-position:-200% 0}}

/* Calidad */
.q{display:flex;gap:14px;padding:16px;border-radius:16px;background:var(--sub);cursor:pointer}
.q .no{font-weight:800;color:var(--warn)}
.q b{display:block;margin-bottom:3px}
.q span{color:var(--ink-2);font-size:13px}

.stack100{display:flex;height:34px;border-radius:10px;overflow:hidden;gap:2px;background:var(--card)}
.stack100 button{border:0;cursor:pointer;color:#fff;font-weight:700;font-size:12px;padding:0 8px;text-align:left;white-space:nowrap;overflow:hidden}

@media (max-width:1100px){
  .search{width:300px}
}
@media (max-width:760px){
  .hdr{flex-wrap:wrap;row-gap:12px}
  .hdr-r{width:100%}
  .search{flex:1;width:auto}
}
@media (max-width:900px){
  .hdr{border-radius:20px;padding:14px 16px}
  .hdr::before{clip-path:polygon(0 0,calc(100% - 30px) 0,100% 30px,100% 100%,0 100%)}
  .logo span{font-size:21px;padding:6px 18px 7px}
  .app{grid-template-columns:1fr;padding:10px;gap:10px;padding-bottom:84px}
  .side{position:fixed;left:8px;right:8px;bottom:8px;top:auto;height:auto;flex-direction:row;padding:6px;border-radius:22px;z-index:70;overflow-x:auto;gap:4px}
  .brand,.nav-group,.side-card{display:none}
  .side{max-height:none}
  .nav{flex-direction:row;gap:2px}
  .nav-ind{display:none}
  .nav-btn{flex-direction:column;gap:2px;font-size:10.5px;padding:7px 9px;min-width:64px;align-items:center}
  .nav-btn[aria-current="page"]{background:var(--accent)}
  .nav-btn .count{display:none}
  .vhead h1{font-size:30px}
  .who{display:none}
  .card{padding:18px}
}

@media (prefers-reduced-motion:reduce){
  *,*::before,*::after{animation:none!important;transition:none!important}
}

/* ---------- Ajustes del informe semanal ---------- */
.hdr::before{background:
    radial-gradient(60% 120% at 88% -10%,rgb(120 190 150 / .55),transparent 60%),
    radial-gradient(45% 90% at 100% 110%,rgb(8 60 36 / .65),transparent 70%),
    linear-gradient(100deg,#1a824d 0%,#177a47 25%,#126a3f 55%,#14683f 80%,#0f5133 100%)}
.nav-ind{background:var(--ink)}
.nav-btn[aria-current="page"]{color:var(--card)}
.nav.gen .nav-btn[aria-current="page"]{background:var(--ink)}
.nav-btn[aria-current="page"] .count{background:rgb(127 127 127 / .3);color:var(--card)}
.tl-acts{position:relative;display:flex;gap:8px;flex-shrink:0}
.tl-btn{position:relative;width:48px;height:48px;border-radius:50%;border:0;background:var(--card);box-shadow:var(--shadow-hover);display:grid;place-items:center;cursor:pointer;color:var(--ink-2)}
.tl-btn:hover{color:var(--ink)}
.tl-btn .ic{width:20px;height:20px}
.badge{position:absolute;top:6px;right:6px;min-width:18px;height:18px;border-radius:999px;background:var(--bad);color:#fff;font-size:10.5px;font-weight:800;display:grid;place-items:center;padding:0 4px;border:2px solid var(--card)}
.notif{top:calc(100% + 10px)}
.semtag{display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:800;color:var(--accent);background:var(--accent-tint);border-radius:999px;padding:3px 10px;margin-left:8px;vertical-align:middle}
.kpi.hero .spark{height:48px}
.wk-days{display:grid;grid-template-columns:repeat(8,1fr);gap:8px}
.wk-day{border:0;background:var(--sub);border-radius:14px;padding:10px 6px;text-align:center;cursor:pointer;font:inherit;color:var(--ink)}
.wk-day:hover{background:var(--accent-tint)}
.wk-day span{display:block;font-size:11px;color:var(--ink-3);font-weight:700}
.wk-day b{display:block;font-size:clamp(18px,2vw,26px);font-weight:800;font-variant-numeric:tabular-nums}
.wk-day em{display:block;font-style:normal;font-size:11.5px;font-weight:700}
.up{color:var(--bad)}.down{color:var(--good)}
@media (max-width:700px){.wk-days{grid-template-columns:repeat(4,1fr)}}
@media (max-width:900px){.nav-btn[aria-current="page"]{background:var(--ink)}.tl-btn{width:42px;height:42px}}
@media print{
  .side,.hdr-r,.tl-acts,.mfilter,.insp,.scrim,.toasts,.open{display:none!important}
  .app{grid-template-columns:1fr;grid-template-areas:"head" "main"}
  .view{display:block!important;break-inside:avoid}
  .card{box-shadow:none;border:1px solid #ddd;break-inside:avoid}
  .topline{position:static}
}

/* ---------- Dashboard de proyectos ---------- */
:root{--org:#b4510a;--org-tint:#fdeadb}
:root[data-theme="dark"]{--org:#ffa86b;--org-tint:#3a2414}
.k5{grid-column:span 12;display:grid;grid-template-columns:1.25fr repeat(4,1fr);gap:16px}
@media (max-width:1180px){.k5{grid-template-columns:repeat(2,1fr)}.k5>:first-child{grid-column:1/-1}}
.kpi.st-at .val{color:var(--good)}.kpi.st-riesgo .val{color:var(--warn)}.kpi.st-cli .val{color:var(--org)}.kpi.st-inc .val{color:var(--bad)}
.kpi .bar4{height:6px;border-radius:999px;background:var(--sub);overflow:hidden;margin-top:2px}
.kpi .bar4 i{display:block;height:100%;border-radius:999px}
.p-org{background:var(--org-tint);color:var(--org)}
.sb{display:inline-flex;align-items:center;gap:6px;font-size:11.5px;font-weight:800;padding:4px 10px;border-radius:999px;white-space:nowrap}
.sb::before{content:"";width:7px;height:7px;border-radius:50%;background:currentColor}
.sb.at{background:var(--good-tint);color:var(--good)}.sb.riesgo{background:var(--warn-tint);color:var(--warn)}.sb.cli{background:var(--org-tint);color:var(--org)}.sb.inc{background:var(--bad-tint);color:var(--bad)}.sb.sin{background:var(--sub);color:var(--ink-2)}
.stackbar{display:flex;height:46px;border-radius:14px;overflow:hidden;gap:3px}
.stackbar button{border:0;cursor:pointer;color:#fff;font:inherit;font-weight:800;font-size:14px;display:flex;align-items:center;justify-content:center;min-width:30px;transition:filter .15s}
.stackbar button:hover{filter:brightness(1.08)}
.stk-leg{display:grid;grid-template-columns:repeat(auto-fit,minmax(118px,1fr));gap:10px;margin-top:14px}
.stk-leg button{border:0;background:var(--sub);border-radius:14px;padding:12px 14px;text-align:left;cursor:pointer;font:inherit;color:var(--ink)}
.stk-leg button:hover{background:var(--accent-tint)}
.stk-leg span{display:flex;align-items:center;gap:7px;font-size:12px;font-weight:700;color:var(--ink-2)}
.stk-leg span i{width:10px;height:10px;border-radius:3px}
.stk-leg b{display:block;font-size:24px;font-weight:800;margin-top:2px;font-variant-numeric:tabular-nums}
.stk-leg em{font-style:normal;font-size:12px;font-weight:700}
.arank{display:flex;flex-direction:column;gap:2px}
.arow{display:grid;grid-template-columns:minmax(150px,1.2fr) 2fr 96px;gap:14px;align-items:center;padding:10px 8px;border-radius:12px;cursor:pointer;transition:background .15s}
.arow:hover{background:var(--sub)}
.arow .an b{display:block;font-size:13px;font-weight:700;line-height:1.25}
.arow .an small{display:block;font-size:11.5px;color:var(--ink-3);font-weight:600;margin-top:2px}
.abar{height:14px;border-radius:999px;background:var(--accent-tint);overflow:hidden}
.abar i{display:block;height:100%;width:0;border-radius:999px;background:var(--accent);transition:width .6s var(--ease)}
.anum{text-align:right;font-variant-numeric:tabular-nums}
.anum b{display:block;font-size:16px;font-weight:800}
.anum em{display:block;font-style:normal;font-size:11.5px;font-weight:800;color:var(--ink-3)}
.mtx{width:100%;border-collapse:separate;border-spacing:6px}
.mtx th{background:none;font-size:11.5px;color:var(--ink-3);text-align:center;padding:4px;position:static}
.mtx th:first-child{text-align:left}
.mtx td{border:0;text-align:center;border-radius:12px;font-weight:800;font-size:16px;padding:12px 6px;cursor:pointer;font-variant-numeric:tabular-nums}
.mtx td:first-child{text-align:left;font-size:13px;font-weight:700;background:none;cursor:pointer}
.mtx td.z{color:var(--ink-3);font-weight:600;background:var(--sub);cursor:default}
.mtx td.tt{background:var(--sub)}
.hitos{display:flex;flex-direction:column;gap:0;position:relative}
.hito{display:grid;grid-template-columns:76px 18px 1fr auto;gap:12px;align-items:start;padding:10px 6px;border-radius:12px;cursor:pointer}
.hito:hover{background:var(--sub)}
.hito .hd8{font-weight:800;font-size:13px;line-height:1.2}
.hito .hd8 small{display:block;font-size:11px;color:var(--ink-3);font-weight:700}
.hito .dot2{width:12px;height:12px;border-radius:50%;margin-top:4px;box-shadow:0 0 0 4px var(--card)}
.hito b{display:block;font-size:13px}
.hito span{font-size:12px;color:var(--ink-2)}
.ganttw{overflow-x:auto}
.gantt{min-width:880px;font-size:12px}
.grow{display:grid;grid-template-columns:44px minmax(220px,1.4fr) 84px 84px 52px 3fr;align-items:center;gap:8px;padding:5px 4px;border-bottom:1px dashed var(--line)}
.grow.h{font-weight:800;color:var(--ink-3);font-size:11px;border-bottom:1px solid var(--line)}
.grow.lv0{font-weight:800}
.grow.lv2 .gt{padding-left:16px;color:var(--ink-2)}
.grow .gt{line-height:1.25}
.gtrack{position:relative;height:16px;background:var(--sub);border-radius:6px}
.gtrack i{position:absolute;top:2px;bottom:2px;border-radius:5px;background:var(--accent-soft)}
.gtrack i b{position:absolute;inset:0;width:0;border-radius:5px;background:var(--accent)}
.gtrack .today{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--bad);border-radius:2px}
.gmonths{position:relative;height:16px}
.gmonths span{position:absolute;font-size:10.5px;font-weight:800;color:var(--ink-3);transform:translateX(-2px)}
.subtabs{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:12px}
.bul{margin:0;padding-left:18px;display:flex;flex-direction:column;gap:10px}
.bul li b{display:block;font-size:13.5px}
.bul li span{font-size:13px;color:var(--ink-2)}
.ncard{background:var(--sub);border-radius:16px;padding:14px 16px;cursor:pointer}
.ncard:hover{background:var(--accent-tint)}
.ncard b{display:block;font-size:13.5px;margin-bottom:4px}
.ncard p{margin:0;font-size:12.5px;color:var(--ink-2);display:-webkit-box;-webkit-line-clamp:3;-webkit-box-orient:vertical;overflow:hidden}
.ngrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(260px,1fr));gap:10px}
.eqgrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.eq{background:var(--sub);border-radius:16px;padding:14px;cursor:pointer}
.eq:hover{background:var(--accent-tint)}
.eq span{font-size:12px;font-weight:700;color:var(--ink-3)}
.eq b{display:block;font-size:30px;font-weight:800}
.eq em{font-style:normal;font-size:12px;color:var(--ink-2)}
.late{font-size:11.5px;font-weight:800}
.late.bad{color:var(--bad)}.late.ok{color:var(--good)}.late.neu{color:var(--ink-3)}
td .sb{font-size:11px}
</style>
</head>
<body>
<div class="app">
  <header class="hdr">
    <div class="hdr-l">
      <span class="logo" role="img" aria-label="Incomelec"><span aria-hidden="true">INCOMELEC</span></span>
    </div>
    <div class="hdr-r">
      <div class="search" role="search">
        <svg class="ic" viewBox="0 0 24 24"><circle cx="11" cy="11" r="8"/><path d="m21 21-4.3-4.3"/></svg>
        <input id="q" type="search" autocomplete="off" placeholder="Buscar proyecto, cliente, CC..." aria-label="Buscar en el informe" aria-controls="results" aria-expanded="false" role="combobox" aria-autocomplete="list">
        <span class="kbd" aria-hidden="true">/</span>
        <div class="results" id="results" role="listbox" aria-label="Resultados"></div>
      </div>
      <div class="ctrl seg" role="radiogroup" aria-label="Tema de color" id="seg"></div>
    </div>
  </header>
  <aside class="side" aria-label="Navegación principal">
    <div class="nav-group" aria-hidden="true">MENÚ</div>
    <nav class="nav" id="nav">
      <span class="nav-ind" id="navInd" aria-hidden="true"></span>
    </nav>
    <div class="side-card" role="note">
      <div class="sc-h"><span class="sc-ic"><svg class="ic" viewBox="0 0 24 24" aria-hidden="true"><path d="M8 2v4M16 2v4"/><rect width="18" height="18" x="3" y="4" rx="2"/><path d="M3 10h18"/></svg></span><div><b>Corte del comité</b><small>Resumen ejecutivo de proyectos</small></div></div>
      <span class="sc-pill" id="scPill"></span>
      <div class="sc-box"><span>Actualizado</span><strong id="scFecha"></strong><em id="scSub"></em></div>
    </div>
  </aside>

function dataTable(host,{title,sub,cols,rows,key,onRow,sort,dir,foot,chips}){let st={sort:sort||cols[0].k,dir:dir||1,q:'',f:'all'};
  host.innerHTML=`<div class="tbl-tools"><div><h2 style="margin:0;font-size:16px">${title}</h2><p class="muted" style="margin:3px 0 0;font-size:12.5px">${sub}</p></div><input class="tbl-search" type="search" placeholder="Buscar en la tabla" aria-label="Buscar en ${esc(title)}"></div>${chips?`<div class="chips" style="margin-bottom:12px">${chips.map(c=>`<button class="chip sm" data-f="${c[0]}" aria-pressed="${c[0]==='all'}">${c[1]} <span class="n">${c[2]}</span></button>`).join('')}</div>`:''}<div class="tbl-wrap"><table><thead><tr>${cols.map(c=>`<th class="${c.n?'n':''}" aria-sort="none"><button data-s="${c.k}">${c.l}<span aria-hidden="true" class="ar"></span></button></th>`).join('')}</tr></thead><tbody></tbody>${foot?`<tfoot><tr></tr></tfoot>`:''}</table></div>`;
  const tb=$('tbody',host);
  const draw=()=>{const list=rows.filter(r=>(st.f==='all'||r._f===st.f||r._f2===st.f)&&(!st.q||Object.values(r).join(' ').toLowerCase().includes(st.q))).sort((a,b)=>{const x=a[st.sort],y=b[st.sort];if(x==null)return 1;if(y==null)return -1;return(typeof x==='string'?x.localeCompare(y,'es'):x-y)*st.dir;});
    tb.innerHTML=list.map(r=>`<tr tabindex="0" data-key="${key(r)}" class="${STATE.selected===key(r)?'is-selected':''}">${cols.map(c=>`<td class="${c.n?'n':''}">${c.f?c.f(r[c.k],r):esc(r[c.k]??'')}</td>`).join('')}</tr>`).join('')||`<tr><td colspan="${cols.length}" class="muted">Sin resultados</td></tr>`;
    $$('tr[data-key]',tb).forEach((tr,i)=>{const r=list[i];tr.addEventListener('click',()=>onRow(r));tr.addEventListener('keydown',e=>{if(e.key==='Enter')onRow(r);if(e.key==='ArrowDown'){e.preventDefault();tr.nextElementSibling&&tr.nextElementSibling.focus();}if(e.key==='ArrowUp'){e.preventDefault();tr.previousElementSibling&&tr.previousElementSibling.focus();}});});
    if(foot){const f=foot(list);$('tfoot tr',host).innerHTML=cols.map(c=>`<td class="${c.n?'n':''}">${f[c.k]??''}</td>`).join('');}
    $$('th',host).forEach(th=>{const k=$('button',th).dataset.s;th.setAttribute('aria-sort',k===st.sort?(st.dir>0?'ascending':'descending'):'none');$('.ar',th).textContent=k===st.sort?(st.dir>0?' ↑':' ↓'):'';});};
  $$('th button',host).forEach(b=>b.addEventListener('click',()=>{const k=b.dataset.s;st.dir=st.sort===k?-st.dir:1;st.sort=k;draw();}));
  $('.tbl-search',host).addEventListener('input',e=>{st.q=e.target.value.toLowerCase();draw();});
  $$('[data-f]',host).forEach(b=>b.addEventListener('click',()=>{st.f=b.dataset.f;$$('[data-f]',host).forEach(x=>x.setAttribute('aria-pressed',x===b));draw();}));
  draw();}

function wireSearch(){const I=searchIndex(),q=$('#q'),box=$('#results');let cur=-1,list=[];const norm=s=>s.toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g,'');

  document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeNotif();if($('#insp').classList.contains('on'))closeInspector();}
    if((e.key==='/'||((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'))&&!/input|textarea/i.test(document.activeElement.tagName)){e.preventDefault();$('#q').focus();}});
  window.addEventListener('resize',moveInd);
  const h=(location.hash||'').slice(1);go(RENDER[h]?h:'resumen');
  if(document.fonts&&document.fonts.ready)document.fonts.ready.then(moveInd);
})();
</script>
